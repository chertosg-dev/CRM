<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta name="theme-color" content="#061b43">
  <title>Ενημέρωση TSERTOS CRM V6</title>
  <style>
    *{box-sizing:border-box}
    body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#061b43,#0b2d67);font-family:system-ui;color:#13264b}
    .card{width:min(430px,100%);padding:24px;border-radius:24px;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.32);text-align:center}
    .shield{display:grid;place-items:center;width:70px;height:80px;margin:0 auto 18px;border:4px solid #f2b629;border-radius:20px 20px 30px 30px;background:#061b43;color:#fff;font:900 25px Georgia}
    h1{margin:0 0 8px;font-size:22px}
    p{margin:0;color:#69758c;line-height:1.5}
    .status{margin-top:18px;padding:12px;border-radius:13px;background:#edf4ff;color:#115be8;font-weight:850}
  </style>
</head>
<body>
  <main class="card">
    <div class="shield">TS</div>
    <h1>Ενημέρωση V6</h1>
    <p>Καθαρίζεται η προηγούμενη έκδοση και ανοίγει η διόρθωση καλυπτόμενων μελών.</p>
    <div class="status" id="status">Καθαρισμός cache…</div>
  </main>

  <script>
    (async () => {
      const status = document.getElementById("status");
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
        localStorage.setItem("tsertos-crm-build", "6.0.0-20260724");
        status.textContent = "Ολοκληρώθηκε. Ανοίγει η V6…";
        setTimeout(() => location.replace("./index.html?v=6.0.0-" + Date.now()), 800);
      } catch (error) {
        status.textContent = "Άνοιξε χειροκίνητα το index.html?v=6";
      }
    })();
  </script>
</body>
</html>
