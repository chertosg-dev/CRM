<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2d4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>TSERTOS Insurance CRM</title>
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div><span class="brand-mark">T</span><div><h1>TSERTOS Insurance CRM</h1><small>Offline • V10.0.0</small></div></div>
    <button id="menuBtn" class="icon-btn" aria-label="Μενού">☰</button>
  </header>

  <nav id="nav" class="nav">
    <button data-view="dashboard" class="active">Αρχική</button>
    <button data-view="customers">Πελάτες</button>
    <button data-view="life">Ζωή</button>
    <button data-view="auto">Αυτοκίνητο</button>
    <button data-view="fire">Πυρός</button>
    <button data-view="receipts">Ανείσπρακτα</button>
    <button data-view="backup">Backup</button>
  </nav>

  <main id="app"></main>

  <dialog id="modal"><div class="modal-card"><div id="modalBody"></div></div></dialog>
  <input id="fileInput" type="file" hidden>
  <div id="toast" class="toast" role="status"></div>

  <script src="jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
